name: Rust Core CI

on:
  push:
    branches: [rust-core, main]
  pull_request:
    branches: [rust-core, main]

jobs:
  rust-tests:
    name: Rust Kernel Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run Rust tests
        run: cargo test -p amplifier-core --verbose
      - name: Check workspace
        run: cargo check -p amplifier-core -p amplifier-core-py
      - name: Rustfmt
        run: cargo fmt -p amplifier-core -p amplifier-core-py --check
      - name: Clippy
        run: cargo clippy -p amplifier-core -p amplifier-core-py -- -D warnings

  node-tests:
    name: Node.js Binding Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Build native module
        working-directory: bindings/node
        run: |
          npm install
          npm run build
      - name: Run tests
        working-directory: bindings/node
        run: npx vitest run
      - name: Clippy (Node binding)
        run: cargo clippy -p amplifier-core-node -- -D warnings

  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv and build
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin
          maturin build --release --out dist
          pip install dist/amplifier_core-*.whl
      - name: Install test dependencies
        run: |
          source .venv/bin/activate
          pip install pytest pytest-asyncio grpcio protobuf grpcio-tools
      - name: Run all Python tests
        run: |
          source .venv/bin/activate
          pytest tests/ bindings/python/tests/ -v --tb=short -m "not slow"
