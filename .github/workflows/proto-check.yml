name: Proto Sync Check

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - 'python/amplifier_core/_grpc_gen/**'
      - 'crates/amplifier-core/src/generated/**'
      - 'uv.lock'
      - 'scripts/generate_grpc_stubs.py'
      - '.github/workflows/proto-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'proto/**'
      - 'python/amplifier_core/_grpc_gen/**'
      - 'crates/amplifier-core/src/generated/**'
      - 'uv.lock'
      - 'scripts/generate_grpc_stubs.py'
      - '.github/workflows/proto-check.yml'

jobs:
  proto-sync:
    name: Verify Python stubs match proto
    runs-on: ubuntu-latest
    env:
      PROTO_CHECK_DIR: /tmp/proto_check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install locked protobuf generator and runtimes
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          packages = tomllib.loads(Path("uv.lock").read_text())["package"]
          versions = {package["name"]: package["version"] for package in packages}
          names = ("grpcio", "grpcio-tools", "protobuf", "setuptools")
          subprocess.check_call([
              sys.executable, "-m", "pip", "install",
              *(f"{name}=={versions[name]}" for name in names),
          ])
          PY

      - name: Regenerate Python stubs
        run: |
          mkdir -p "$PROTO_CHECK_DIR"
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out="$PROTO_CHECK_DIR" \
            --grpc_python_out="$PROTO_CHECK_DIR" \
            proto/amplifier_module.proto

      - name: Compare with committed stubs
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          generated = Path(os.environ["PROTO_CHECK_DIR"])
          mismatches = []
          for directory in (Path("proto"), Path("python/amplifier_core/_grpc_gen")):
              for filename in ("amplifier_module_pb2.py", "amplifier_module_pb2_grpc.py"):
                  expected = (generated / filename).read_bytes()
                  if directory.name == "_grpc_gen" and filename.endswith("_grpc.py"):
                      # The packaged service stub uses its sibling schema module.
                      expected = expected.replace(
                          b"import amplifier_module_pb2 as amplifier__module__pb2",
                          b"from . import amplifier_module_pb2 as amplifier__module__pb2",
                      )
                  committed = directory / filename
                  if committed.read_bytes() != expected:
                      mismatches.append(str(committed))
          if mismatches:
              raise SystemExit("FAIL: regenerate committed stubs: " + ", ".join(mismatches))
          print("PASS: all four committed Python stubs match the locked generator")
          PY

  rust-build:
    name: Rust build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cargo test (default features)
        run: cargo test -p amplifier-core

      - name: Cargo test (wasm feature)
        run: cargo test -p amplifier-core --features wasm

      - name: Clippy
        run: cargo clippy -p amplifier-core -- -D warnings

      - name: Clippy (wasm)
        run: cargo clippy -p amplifier-core --features wasm -- -D warnings

      - name: Format check
        run: cargo fmt -p amplifier-core --check