name: Proto Sync Check

on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - 'python/amplifier_core/_grpc_gen/**'
      - 'crates/amplifier-core/src/generated/**'
      - 'scripts/generate_grpc_stubs.py'
      - '.github/workflows/proto-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'proto/**'
      - 'python/amplifier_core/_grpc_gen/**'
      - 'crates/amplifier-core/src/generated/**'
      - 'scripts/generate_grpc_stubs.py'
      - '.github/workflows/proto-check.yml'

jobs:
  proto-sync:
    name: Verify Python stubs match proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install grpcio-tools
        run: pip install grpcio-tools==1.78.0

      - name: Regenerate Python stubs
        run: |
          python scripts/generate_grpc_stubs.py --output /tmp/proto_check

      - name: Compare with committed stubs
        run: |
          diff -u python/amplifier_core/_grpc_gen/amplifier_module_pb2.py \
            /tmp/proto_check/amplifier_module_pb2.py
          diff -u python/amplifier_core/_grpc_gen/amplifier_module_pb2_grpc.py \
            /tmp/proto_check/amplifier_module_pb2_grpc.py

  rust-build:
    name: Rust build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cargo test (default features)
        run: cargo test -p amplifier-core

      - name: Cargo test (wasm feature)
        run: cargo test -p amplifier-core --features wasm

      - name: Clippy
        run: cargo clippy -p amplifier-core -- -D warnings

      - name: Clippy (wasm)
        run: cargo clippy -p amplifier-core --features wasm -- -D warnings

      - name: Format check
        run: cargo fmt -p amplifier-core --check